<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>ルーレット</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<script src="sw-register.js" defer></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1 class="title">ルーレット</h1>
    <p class="subtitle">タップして今日の運試し</p>
  </header>

  <main id="stage">
    <div id="wheel-wrap">
      <div id="pointer" aria-hidden="true"></div>
      <canvas id="wheel"></canvas>
      <button id="spin-btn" type="button" aria-label="ルーレットを回す">SPIN</button>
    </div>
    <div id="result" class="result" aria-live="polite"></div>
  </main>

  <section id="editor" aria-label="項目の編集">
    <div class="editor-head">
      <h2>項目</h2>
      <label class="toggle">
        <input type="checkbox" id="remove-winner">
        <span>当たった項目を消す</span>
      </label>
    </div>

    <form id="add-form" autocomplete="off">
      <input type="text" id="item-input" maxlength="24" placeholder="項目を追加（例：ラーメン）" aria-label="追加する項目">
      <button type="submit" class="btn add" aria-label="追加">＋</button>
    </form>

    <ul id="item-list" class="item-list"></ul>

    <div class="editor-actions">
      <button type="button" id="reset-btn" class="btn ghost">初期化</button>
      <button type="button" id="shuffle-btn" class="btn ghost">シャッフル</button>
    </div>
  </section>
</div>

<div id="win-modal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="win-title">
  <div class="panel">
    <div class="win-label">結果</div>
    <div id="win-title" class="win-name">—</div>
    <button type="button" id="win-close" class="btn primary">閉じる</button>
  </div>
</div>

<script src="roulette.js" defer></script>
</body>
</html>
