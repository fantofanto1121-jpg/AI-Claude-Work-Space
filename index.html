<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<title>NEON VOYAGER</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<script src="sw-register.js" defer></script>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div class="stat">
        <div class="stat-label">SCORE</div>
        <div id="score" class="stat-value">0</div>
      </div>
      <div class="stat small">
        <div class="stat-label">BEST</div>
        <div id="best" class="stat-value">0</div>
      </div>
    </div>
    <div class="hud-right">
      <div id="combo" class="combo hidden">x1</div>
      <div class="shield-wrap">
        <div class="shield-label">SHIELD</div>
        <div class="shield-bar"><div id="shield-fill" class="shield-fill"></div></div>
      </div>
    </div>
  </div>

  <div id="hint" class="hint">ドラッグ / マウスで機体を動かそう</div>

  <div id="start-screen" class="overlay">
    <div class="panel">
      <div class="logo">
        <span class="logo-neon">NEON</span>
        <span class="logo-sub">VOYAGER</span>
      </div>
      <p class="lead">流れる星屑の海を駆け抜けろ</p>
      <ul class="rules">
        <li>機体は指 / マウスに追従して自動で連射</li>
        <li>敵を撃ち落とし、光のかけらを集める</li>
        <li>連続撃破で<b>COMBO</b>ボーナス</li>
      </ul>
      <button id="start-btn" class="btn primary">START</button>
    </div>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <div class="panel">
      <h2 class="go-title">GAME OVER</h2>
      <div class="result-row">
        <span>SCORE</span>
        <b id="final-score">0</b>
      </div>
      <div class="result-row">
        <span>BEST</span>
        <b id="final-best">0</b>
      </div>
      <div id="new-record" class="new-record hidden">NEW RECORD!</div>
      <button id="retry-btn" class="btn primary">RETRY</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
